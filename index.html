<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>HE Pursuit — Bid/No-Bid Decisions for Small Government Contractors | Honest Echo</title>

    <link rel="canonical" href="https://honestecho.com/" />

    <!-- Open Graph / social fallback (per-page values injected by react-helmet on render) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Honest Echo" />
    <meta property="og:url" content="https://honestecho.com/" />
    <meta property="og:title" content="HE Pursuit — Bid/No-Bid Decisions for Small Government Contractors" />
    <meta property="og:description" content="Find, qualify, and decide on government contracting opportunities faster. SAM.gov opportunity scoring, fit analysis, and pursuit intelligence for lean GovCon teams." />
    <meta property="og:image" content="https://honestecho.com/pursuit-overview-3.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HE Pursuit — Bid/No-Bid Decisions for Small Government Contractors" />
    <meta name="twitter:description" content="Qualify government contracting opportunities in minutes. SAM.gov opportunity scoring and pursuit intelligence for lean GovCon teams." />
    <meta name="twitter:image" content="https://honestecho.com/pursuit-overview-3.png" />

    <!-- Structured data (Organization + SoftwareApplication) is injected by react-helmet
         via src/components/SchemaOrg.tsx — kept single-source to avoid duplicate/conflicting JSON-LD. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Pre-hydration page view (2026-09-12). The React page_viewed fires from a
         useEffect after the bundle loads, so a visitor who bounces before hydration
         leaves no session — 3 of 35 paid clicks (8.6%) in fall26_search did exactly
         that. This mirrors src/lib/analytics.ts (same storage keys, same attribution
         capture) and posts the first page view immediately; PageViews in App.tsx
         skips its own first fire when window.__hePvPath matches, so no duplicate.
         Endpoint literal = the default in src/lib/api.ts. -->
    <script>
      (function () {
        try {
          // Production hosts only — analytics.ts has a DEV guard; this must too, or
          // local Vite / Cloudflare preview visits land in prod as humans.
          if (location.hostname !== 'honestecho.com' && location.hostname !== 'www.honestecho.com') return;
          var KEY = 'he_anon_id';
          var id = localStorage.getItem(KEY);
          if (!id) { id = crypto.randomUUID(); localStorage.setItem(KEY, id); }
          var attr = {};
          try { var st = sessionStorage.getItem('he_attribution'); if (st) { var pj = JSON.parse(st); if (pj && typeof pj === 'object' && !Array.isArray(pj)) attr = pj; } } catch (e) {}
          if (!Object.keys(attr).length) {
            new URLSearchParams(location.search).forEach(function (v, k) {
              if (k === 'src' || k === 'promo' || k === 'gclid' || k === 'gbraid' || k === 'wbraid' || k.indexOf('utm_') === 0 || k.indexOf('vt_') === 0) {
                var clean = v.replace(/[\s"'.,;:)\]}>]+$/, '');
                if (clean) attr[k] = clean;
              }
            });
            if (Object.keys(attr).length) { try { sessionStorage.setItem('he_attribution', JSON.stringify(attr)); } catch (e) {} }
          }
          var ref = sessionStorage.getItem('he_referrer');
          if (ref === null) {
            ref = '';
            try { if (document.referrer) { var h = new URL(document.referrer).hostname; if (h && h !== location.hostname) ref = h; } } catch (e) {}
            try { sessionStorage.setItem('he_referrer', ref); } catch (e) {}
          }
          var props = { path: location.pathname, early: true };
          for (var k in attr) props[k] = attr[k];
          if (ref) props.referrer = ref;
          var path = location.pathname;
          window.__hePvPath = path;
          var body = JSON.stringify({ events: [{ event_name: 'page_viewed', anonymous_id: id, page: path, properties: props, source: 'website' }] });
          var send = function () {
            return fetch('https://he-pursuit-api.onrender.com/api/analytics/track', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true, body: body
            });
          };
          // Delivery failure: if React has not consumed the flag yet, clear it so
          // PageViews fires its own; if it already skipped, resend once ourselves.
          var failed = function () {
            if (window.__hePvPath === path) { window.__hePvPath = undefined; return; }
            send().catch(function () {});
          };
          send().then(function (r) { if (!r.ok) failed(); }).catch(failed);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
